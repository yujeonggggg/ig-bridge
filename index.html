<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>이동 중…</title>
  <style>
    html, body { height:100%; margin:0; }
    body {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
      color:#222; padding:24px; box-sizing:border-box; background:#fafbfc; text-align:center;
    }
    .spinner {
      width:32px; height:32px; border:3px solid #eee; border-top-color:#4b7bec;
      border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    h1 { font-size:17px; margin:0 0 8px; font-weight:600; }
    .target { font-size:12px; color:#b5bbc2; margin-top:14px; word-break:break-all; max-width:320px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>잠시 후 이동합니다…</h1>
  <div class="target" id="target"></div>

  <script>
  (function () {
    // 목적지: ?url= 로 받되 없으면 기본값
    var DEFAULT_TARGET = "https://www.coupang.com/vp/products/6731245116";
    var params = new URLSearchParams(location.search);
    var target = params.get("url") || DEFAULT_TARGET;
    // ?url= 가 없거나 http(s) 형식이 아니면(플레이스홀더를 그대로 붙여넣는 등) 기본값으로
    if (!/^https?:\/\//i.test(target)) target = DEFAULT_TARGET;
    document.getElementById("target").textContent = target;

    var ua = navigator.userAgent.toLowerCase();
    var isAndroid = /android/.test(ua);
    var isIOS = /iphone|ipad|ipod/.test(ua);
    var enc = encodeURIComponent(target);

    if (isAndroid) {
      // 인앱 브라우저는 자동 intent 탈출이 막히는 경우가 많아,
      // 확인창(얼럿) → 사용자 탭(제스처)으로 기본 브라우저를 실행한다.
      var hostAndRest = target.replace(/^https?:\/\//, "");
      var intentUrl =
        "intent://" + hostAndRest + "#Intent;scheme=https;" +
        "S.browser_fallback_url=" + enc + ";end";
      if (window.confirm("기본 브라우저로 열까요?")) {
        location.href = intentUrl;   // 기본 브라우저/검증된 App Links 앱 실행
      } else {
        location.replace(target);    // 취소 시 인앱 브라우저에서 그대로 보기
      }
      return;
    }

    if (isIOS) {
      // 크롬 설치 시 크롬으로 탈출(https→googlechromes). 미설치/실패 시 폴백 타이머가 인앱 랜딩.
      var chromeScheme = target
        .replace(/^https:\/\//, "googlechromes://")
        .replace(/^http:\/\//, "googlechrome://");
      // 멈추지 않도록 폴백은 반드시 동작. '실제 페이지 이탈'(pagehide) 시에만 취소해 중복 이동 방지.
      var fallbackTimer = setTimeout(function () {
        location.replace(target);
      }, 1500);
      window.addEventListener("pagehide", function () {
        if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
      });
      location.href = chromeScheme;
      return;
    }

    // PC/기타: 곧바로 목적지로
    location.replace(target);
  })();
  </script>
</body>
</html>
