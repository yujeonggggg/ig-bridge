<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>이동 중…</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: #222; padding: 24px; box-sizing: border-box; text-align: center;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #eee; border-top-color: #4b7bec;
      border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #fallback { display: none; margin-top: 20px; }
    #fallback a {
      display: inline-block; padding: 12px 20px; background: #4b7bec; color: #fff;
      border-radius: 8px; text-decoration: none; font-size: 16px; font-weight: 600;
    }
    .hint { color: #888; font-size: 14px; margin-top: 12px; }
    .dbg { color: #bbb; font-size: 12px; margin-top: 24px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div>페이지로 이동하고 있어요…</div>

  <div id="fallback">
    <a id="fallbackLink" href="#">외부 브라우저에서 열기</a>
    <div class="hint">자동으로 열리지 않으면 위 버튼을 눌러주세요.</div>
  </div>

  <div class="dbg" id="dbg"></div>

  <script>
  (function () {
    // 목적지: ?url= 파라미터로 받되, 없으면 기본값(테스트용) 사용
    var DEFAULT_TARGET = "https://brand.naver.com/set-of/products/13636836808";
    var params = new URLSearchParams(location.search);
    var target = params.get("url") || DEFAULT_TARGET;

    var ua = navigator.userAgent.toLowerCase();
    var isAndroid = /android/.test(ua);
    var isIOS = /iphone|ipad|ipod/.test(ua);
    var enc = encodeURIComponent(target);

    // 안드로이드: intent 스킴으로 인앱 웹뷰 탈출.
    // 기본은 '기기 기본 브라우저'로 열고(package 미지정), ?force=chrome 이면 크롬 강제.
    var forceChrome = params.get("force") === "chrome";
    var hostAndRest = target.replace(/^https?:\/\//, "");
    var intentUrl =
      "intent://" + hostAndRest +
      "#Intent;scheme=https;" +
      (forceChrome ? "package=com.android.chrome;" : "") +
      "S.browser_fallback_url=" + enc + ";end";

    // 디버그: 어떤 분기/모드를 탔는지 화면에 표시(테스트 편의)
    document.getElementById("dbg").textContent =
      (isAndroid ? "ANDROID(" + (forceChrome ? "chrome" : "default-browser") + ")" : isIOS ? "iOS" : "WEB") +
      " · target=" + target;

    function showFallback(href) {
      document.getElementById("fallbackLink").setAttribute("href", href);
      document.getElementById("fallback").style.display = "block";
    }

    if (isAndroid) {
      showFallback(intentUrl);     // 자동 리다이렉트가 막히면 수동 버튼
      location.href = intentUrl;   // 외부 브라우저로 자동 탈출 시도
    } else {
      showFallback(target);
      location.replace(target);    // iOS / PC 웹: 그대로 이동
    }
  })();
  </script>
</body>
</html>
